
<!DOCTYPE html>
<html>
<head>
    <title>HTML TABLE</title>
</head>
<body>

    <table border="1" width="60%" height="400">
        <thead>
            <tr>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
                <th>E</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>F</td>
                <td>G</td>
                <td rowspan="2" colspan="2">H</td>
                <td>I</td>
            </tr>
            <tr>
                <td>J</td>
                <td>K</td>
                <td>L</td>
            </tr>
            <tr>
                <td>M</td>
                <td rowspan="3">N</td>
                <td>O</td>
                <td>P</td>
                <td>Q</td>
            </tr>
            <tr>
                <td rowspan="2">R</td>
                <td>S</td>
                <td>T</td>
                <td></td>
            </tr>
            <tr>
                <td colspan="3">U</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="5">ZZZ</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
