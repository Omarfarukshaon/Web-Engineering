<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            color: #00897b;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #80cbc4;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #009688;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #009688;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        /* Hover Effect */

        button:hover {
            background: #00695c;
            transform: scale(1.05);
        }

        /* Click Effect */

        button:active {
            transform: scale(0.95);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
        }

    </style>
</head>

<body>

    <div class="calculator">

        <h2>DOM Manipulation</h2>

        <input type="number" id="var1"
            placeholder="Variable A">

        <input type="number" id="var2"
            placeholder="Variable B">

        <div class="buttons">

            <button onclick="calculate('add')">
                Add 
            </button>

            <button onclick="calculate('subtract')">
                Subtract 
            </button>

            <button onclick="calculate('multiply')">
                Multiply 
            </button>

            <button onclick="calculate('divide')">
                Divide 
            </button>

        </div>

        <div class="result">
            Result: <span id="result">0</span>
        </div>

    </div>

    <script>
        function calculate(operation) {

            let a = parseFloat(
                document.getElementById("var1").value
            );

            let b = parseFloat(
                document.getElementById("var2").value
            );

            let result;

            if (isNaN(a) || isNaN(b)) {
                document.getElementById("result").innerText =
                    "Enter both variables!";
                return;
            }

            switch (operation) {

                case 'add':
                    result = a + b;
                    break;

                case 'subtract':
                    result = a - b;
                    break;

                case 'multiply':
                    result = a * b;
                    break;

                case 'divide':

                    if (b === 0) {
                        document.getElementById("result").innerText =
                            "Cannot divide by zero!";
                        return;
                    }

                    result = a / b;
                    break;
            }

            document.getElementById("result").innerText = result;
        }
    </script>

</body>
</html>
